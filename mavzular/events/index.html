    <div class="login-container">
        <!-- Chap tomondagi login formasi -->
        <div class="login-card">
            <div class="logo">Your logo</div>
            <h2>Login</h2>

            <form action="#">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Username@gmail.com" required>
                </div>

                <div class="input-group password-group">
                    <label for="password-input">Password</label>

                    <!-- JS-siz parolni ko'rsatish uchun maxsus checkbox va inputlar -->
                    <div class="password-wrapper">
                        <input type="password" class="pwd-field pass-hidden" placeholder="Password" required>
                        <input type="text" class="pwd-field pass-shown" placeholder="Password">

                        <input type="checkbox" id="toggle-pwd" class="pwd-checkbox">
                        <label Bres for="toggle-pwd" class="pwd-label">
                            <i class="fa-regular fa-eye-slash eye-close"></i>
                            <i class="fa-regular fa-eye eye-open"></i>
                        </label>
                    </div>
                </div>

                <div class="forgot-pass">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-sign-in">Sign in</button>
            </form>

            <div class="divider">
                <span>Or Continue With</span>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn"><i class="fa-brands fa-google"
                        style="color: #db4437;"></i></button>
                <button type="button" class="social-btn"><i class="fa-brands fa-github"
                        style="color: #333;"></i></button>
                <button type="button" class="social-btn"><i class="fa-brands fa-facebook"
                        style="color: #1877f2;"></i></button>
            </div>

            <div class="register-link">
                Don't have an account yet? <a href="#">Register for free</a>
            </div>
        </div>

        <!-- O'ng tomondagi illyustratsiya qismi -->
        <div class="illustration-side">
            <!-- 3D personaj rasmi o'rni -->
            <img src="https://placeholder.com" alt="Character" class="main-char">
            <div class="leaf leaf-1"></div>
            <div class="leaf leaf-2"></div>
            <div class="leaf leaf-3"></div>
        </div>
    </div>
