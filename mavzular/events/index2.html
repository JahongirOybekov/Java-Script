<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="./style2.css">
</head>
<body>
    <div class="login-container">
        
        <!-- Chap tomondagi login formasi -->
        <div class="login-card">
            <div class="logo">Your logo</div>
            <h2>Login</h2>
            
            <form action="#">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Username@gmail.com" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Password" required>
                </div>
                
                <div class="forgot-pass">
                    <a href="#">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn-sign-in">Sign in</button>
            </form>
            
            <div class="divider">Or Continue With</div>
            
            <div class="social-login">
                <button type="button" class="social-btn"><i class="fa-brands fa-google" style="color: #db4437;"></i></button>
                <button type="button" class="social-btn"><i class="fa-brands fa-github" style="color: #333;"></i></button>
                <button type="button" class="social-btn"><i class="fa-brands fa-facebook" style="color: #1877f2;"></i></button>
            </div>
            
            <div class="register-link">
                Don't have an account yet? <a href="#">Register for free</a>
            </div>
        </div>

        <!-- O'ng tomondagi rasm qismi -->
        <div class="image-side">
            <img src="https://placeholder.com" alt="Character">
        </div>

    </div>
</body>
</html>
